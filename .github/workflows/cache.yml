name: Caching Primes

on:
  pull_request_target:
    types:
      - closed

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Cache Primes
      id: cache-primes
      uses: actions/cache@v6
      with:
        path: ../workflows
        key: ${{ runner.os }}--${{ hashFiles('../../actions') }}
        


